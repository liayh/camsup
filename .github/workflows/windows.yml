# Fabrique l'installateur Windows sur un vrai Windows (GitHub), puis l'installe pour vérifier qu'il démarre.
# Résultat : lien direct, toujours le même :
#   https://github.com/liayh/camsup/releases/download/derniere-version/CamSup-Installation-1.1.0.exe
name: Installateur Windows

on:
  push:
    branches: [main, securite-durcissement]
  workflow_dispatch:

permissions:
  contents: write          # publier l'installateur (« derniere-version »)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inno Setup (fabrication de l'installateur)
        run: choco install innosetup -y --no-progress

      - name: Tests sous Windows (informatif)
        continue-on-error: true
        run: |
          python -m pip install -q -r requirements-dev.txt
          python -m pytest tests -q

      - name: Fabrication (interface, Python et bibliothèques, ffmpeg, installateur)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - name: Publication du .exe (lien direct « derniere-version »)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version dist/CamSup-Installation-*.exe --prerelease --target "$GITHUB_SHA" \
            --title "CamSup — dernière version (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Installateur Windows fabriqué automatiquement. Double-clic, droits administrateur ; au premier lancement, créez votre compte."

      - name: Installation d'essai sur ce Windows (silencieuse)
        shell: powershell
        timeout-minutes: 15
        run: |
          $exe = Get-ChildItem dist\CamSup-Installation-*.exe | Select-Object -First 1
          # WaitForExit (pas -Wait : il attendrait aussi la fenêtre d'alerte lancée par l'installateur, qui reste ouverte)
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -PassThru
          $p.WaitForExit()
          Write-Host "Code de sortie de l'installateur : $($p.ExitCode)"
          Get-ScheduledTask -TaskName CamSup | Format-List TaskName,State,Principal
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { $r = Invoke-WebRequest http://127.0.0.1:8080/api/health -UseBasicParsing -TimeoutSec 3; $ok = $true; break }
            catch { Start-Sleep 2 }
          }
          Write-Host "Serveur joignable : $ok"
          if ($ok) { Write-Host "Premier lancement (compte à créer) : $((Invoke-WebRequest http://127.0.0.1:8080/api/setup -UseBasicParsing).Content)" }
          Write-Host "--- droits"; icacls C:\ProgramData\CamSup; icacls C:\ProgramData\CamSup\data
          Write-Host "--- journaux"; Get-ChildItem C:\ProgramData\CamSup\data\logs -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          if ($p.ExitCode -ne 0 -or -not $ok) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CamSup-Installation
          path: |
            dist/CamSup-Installation-*.exe
            install.log
          if-no-files-found: warn
